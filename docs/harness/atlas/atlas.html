<meta charset="utf-8">
<title>Stratum harness Atlas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --paper:#E6DFBE; --paper-2:#DCD4AF; --ink:#17170F; --ink-2:#6E6B54; --rule:#B9B293; --ghost:#8E8A70;
  --hi-bg:#17170F; --hi-fg:#E6DFBE; --face:#EFE9CC; --grid:#CFC8A3;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1E1D15; --paper-2:#26251B; --ink:#E6DFBE; --ink-2:#A8A388; --rule:#4A4838; --ghost:#6E6B54;
    --hi-bg:#E6DFBE; --hi-fg:#1E1D15; --face:#2A2920; --grid:#33321F;
  }
}
:root[data-theme="dark"]{
  --paper:#1E1D15; --paper-2:#26251B; --ink:#E6DFBE; --ink-2:#A8A388; --rule:#4A4838; --ghost:#6E6B54;
  --hi-bg:#E6DFBE; --hi-fg:#1E1D15; --face:#2A2920; --grid:#33321F;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.55;overflow:hidden}
#app{display:grid;grid-template-rows:52px 1fr 30px;height:100vh;min-height:600px}
#top{display:flex;align-items:stretch;border-bottom:1.5px solid var(--ink);overflow:hidden}
.stat{padding:6px 14px 4px;border-right:1.5px solid var(--ink);min-width:0;white-space:nowrap}
.stat .k{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.stat .v{font-size:15px;font-variant-numeric:tabular-nums}
.stat.grow{flex:1;border-right:none;overflow:hidden}
#controls{display:flex;gap:8px;align-items:center;padding:0 14px;border-left:1.5px solid var(--ink)}
button.ctl{font:inherit;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);padding:5px 10px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);white-space:nowrap}
button.ctl:hover{background:var(--face)}
button.ctl:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
button.ctl:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button.ctl.primary{background:var(--hi-bg);color:var(--hi-fg)}
button.ctl.primary:hover{background:var(--hi-bg);opacity:.9}
button.ctl:disabled{opacity:.4;cursor:default;box-shadow:none}
#main{display:grid;grid-template-columns:232px 1fr 440px;min-height:0}
#index{border-right:1.5px solid var(--ink);overflow-y:auto;padding:10px 8px 20px}
#index h4{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:12px 4px 6px;font-weight:500}
#index h4:first-child{margin-top:2px}
.ix{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;font:inherit;font-size:11.5px;line-height:1.3;background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);padding:7px 8px;margin:0 0 6px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);text-transform:uppercase;letter-spacing:.02em}
.ix .code{color:var(--ink-2);min-width:16px;font-size:10px;padding-top:1px}
.ix .nm{flex:1}
.ix .n{color:var(--ink-2);font-size:10.5px;font-variant-numeric:tabular-nums}
.ix.ghost{border-style:dashed;box-shadow:none;color:var(--ink-2)}
.ix.later{border-color:var(--rule);box-shadow:none;color:var(--ink-2);opacity:.75}
.ix.later .n{font-size:9px;letter-spacing:.06em}
.ix.new{outline:1.5px dashed var(--ink);outline-offset:2px}
.ix.on{background:var(--hi-bg);color:var(--hi-fg)}
.ix.on .code,.ix.on .n{color:var(--hi-fg);opacity:.75}
.ix:hover:not(.on){background:var(--face)}
.ix:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
#canvasWrap{position:relative;min-width:0;background:var(--paper)}
#svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#svg.dragging{cursor:grabbing}
#zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:30px;height:26px;font:inherit;font-size:14px;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
#rail{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:calc(100% - 70px)}
#rail .ch{width:22px;height:22px;font:inherit;font-size:10px;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);cursor:pointer;padding:0;line-height:1}
#rail .ch.done{background:var(--face)}
#rail .ch.on{background:var(--hi-bg);color:var(--hi-fg)}
#rail .ch.locked{border-style:dashed;color:var(--ink-2)}
#rail .ch:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
#rail .title{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-left:6px}
#rail .title b{color:var(--ink);font-weight:500}
#flowSel{position:absolute;left:12px;bottom:12px;display:none;gap:6px}
#flowSel button{font:inherit;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);padding:3px 8px;cursor:pointer}
#flowSel button.on{background:var(--hi-bg);color:var(--hi-fg)}
#tip{position:absolute;pointer-events:none;background:var(--hi-bg);color:var(--hi-fg);font-size:11px;padding:4px 8px;max-width:280px;line-height:1.35;display:none;z-index:5}
#panel{border-left:1.5px solid var(--ink);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;border-bottom:1.5px solid var(--ink)}
#tabs button{flex:1;font:inherit;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:9px 6px;background:var(--paper);color:var(--ink);border:none;border-right:1.5px solid var(--ink);cursor:pointer}
#tabs button:last-child{border-right:none}
#tabs button.on{background:var(--hi-bg);color:var(--hi-fg)}
#tabs button:focus-visible{outline:2px solid var(--ink);outline-offset:-3px}
#body{overflow-y:auto;padding:14px 18px 40px;flex:1}
.eyebrow{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
h1.t{font-size:22px;font-weight:500;line-height:1.2;margin:2px 0 4px;text-wrap:balance}
.lede{font-size:14.5px;line-height:1.5;margin:0 0 14px;max-width:56ch}
.sub{color:var(--ink-2);font-size:11px;margin-bottom:14px}
h3.sec{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:500;margin:20px 0 6px;padding-bottom:4px;border-bottom:1.5px solid var(--ink)}
#body p{margin:0 0 12px;max-width:62ch}
#body ul{margin:0 0 12px;padding-left:18px;max-width:62ch}
#body li{margin-bottom:6px}
mark{background:var(--hi-bg);color:var(--hi-fg);padding:0 3px}
.chip{display:inline-block;border:1.5px solid var(--ink);padding:1px 6px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin:0 6px 6px 0;background:var(--paper);color:var(--ink);font-family:inherit;cursor:pointer}
.chip.ghost{border-style:dashed;color:var(--ink-2)}
.chip.static{cursor:default}
pre{background:var(--face);border:1.5px solid var(--rule);padding:10px 12px;font-size:11px;line-height:1.45;overflow-x:auto;margin:0 0 12px;white-space:pre}
.step{display:grid;grid-template-columns:24px 1fr;gap:8px;margin:0 0 8px;font-size:12px}
.step .no{color:var(--ink-2);font-variant-numeric:tabular-nums}
.step.cur .no{color:var(--ink);font-weight:600}
.step.cur .tx{background:var(--face);outline:1.5px solid var(--ink);padding:2px 6px}
.actions{display:flex;gap:8px;margin:14px 0 0;flex-wrap:wrap}
.pk{border:1.5px solid var(--ink);padding:10px 12px;margin:0 0 12px}
.pk .lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.pk .route{font-size:12px;margin:2px 0 8px}
details{border-top:1.5px solid var(--rule);margin:8px 0 0;padding:6px 0 0}
details summary{cursor:pointer;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);list-style:none;display:flex;gap:8px;align-items:center}
details summary::before{content:'+';display:inline-block;width:12px;color:var(--ink)}
details[open] summary::before{content:'−'}
details summary::-webkit-details-marker{display:none}
details > *:not(summary){margin-top:8px}
#hint{border-top:1.5px solid var(--ink);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;padding:0 14px;gap:14px;overflow:hidden;white-space:nowrap}
.q{padding-left:0;list-style:none}
.q li{position:relative;padding-left:18px}
.q li::before{content:'?';position:absolute;left:0;top:0;color:var(--ink-2)}
.q li.res::before{content:'✓'}
.q li.to::before{content:'→'}
.q li.res>span,.q li.to>span{color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--rule)}
.q li.to>span{text-decoration:none}
.q .ans{margin-top:2px;padding-left:10px;border-left:1.5px solid var(--ink)}
@keyframes halo{0%{opacity:.9}50%{opacity:.25}100%{opacity:.9}}
.halo{animation:halo 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.halo{animation:none}}
@media (max-width:1100px){#main{grid-template-columns:200px 1fr 360px}}
</style>

<script>
const GROUPS = [{"id":"loop","title":"You and the lanes"},{"id":"mem","title":"Files on disk"},{"id":"agents","title":"Agents"},{"id":"check","title":"Checks and second opinions"},{"id":"guard","title":"Hooks and status line"},{"id":"ship","title":"Shipping"}];
const NODES = [{"id":"U","code":"U","name":"You","short":"YOU","group":"loop","gx":0,"gy":8,"w":2,"d":2,"h":36,"kind":"screen","one":"The person who gives the task and agrees at each gate.","what":"You type a task in plain words, answer questions one at a time, and say yes or no at each gate. Nothing is pushed until you say push.","how":"You start <code>/st</code> in Claude Code. The lane views show every step that passes data to you, and each gate step names what you must say. LikeC4 id: <code>user</code>."},{"id":"O","code":"O","name":"Orchestrator /st","short":"/ST","group":"loop","gx":4,"gy":8,"w":3,"d":3,"h":64,"kind":"tall","one":"The main entry: it picks the lane and risk level, runs the lane and checks what comes back.","what":"You tell /st what you want. It reads where the work stands, picks how much process the task needs, tells you in one line, and then runs that lane. It routes and checks. Other parts do the work.","how":"<code>skills/st/SKILL.md</code>. It reads <code>.stratum/state.json</code>, <code>.stratum/handoff.md</code> and <code>graphify-out/GRAPH_REPORT.md</code>, sets the risk level with <code>scripts/st-state.sh</code>, and starts the phase and lane skills, the st-build and st-git agents, /st-worker, /st-pr and /st-handoff. It re-runs tests with <code>scripts/st-verify.sh</code>. LikeC4 id: <code>skills.st</code>.","steps":[["Read","Feature, phase and lane from .stratum/state.json, and the last handoff."],["Pick","Lane and risk level from the impact areas of the task."],["Say","One line to you: the lane and the risk."],["Run","Start the phase skills or the lane skill."],["Check","Re-run what the agents report with st-verify.sh."],["Commit","Hand the exact files to the st-git agent."]]},{"id":"L","code":"L","name":"Lane skills","short":"LANES","group":"loop","gx":8,"gy":4,"w":2,"d":2,"h":40,"kind":"box","one":"The four ways a task can run: Full, Fast, Quick and Design.","what":"Full is for a feature: five phases and four gates. Fast is for a small change: one short plan and one gate. Quick is for a one-file edit with no gate. Design builds a screen in one of three modes.","how":"<code>skills/st-full</code> runs Define, Plan, Inspect, Build and Close without lane selection. <code>skills/st-fast</code> writes a change plan under <code>specs/&lt;feature&gt;/changes/</code> and asks at one gate. <code>skills/st-quick</code> has no gate. <code>skills/st-design</code> has the new look, autonomous and custom modes, reads <code>DESIGN.md</code>, <code>.impeccable</code> and <code>package.json</code>, checks its tools with <code>scripts/st-design-check.sh</code> and drives FigCraft with <code>scripts/st-figcraft.sh</code>. LikeC4 ids: <code>skills.st-full</code>, <code>skills.st-fast</code>, <code>skills.st-quick</code>, <code>skills.st-design</code>, <code>scripts.st-design-check-sh</code>, <code>scripts.st-figcraft-sh</code>, and the data <code>project.design-md</code>, <code>project.impeccable</code>, <code>project.design</code>, <code>project.package-json</code>.","steps":[["Full","Define, Plan, Inspect, Build, Close, with four gates."],["Fast","Change plan, gate, test first, review, commit, drift fix."],["Quick","One file, no gate, verify, commit."],["Design","Tool check, mode line, then new look, autonomous or custom."]]},{"id":"P","code":"P","name":"Phase skills","short":"PHASES","group":"loop","gx":8,"gy":8,"w":3,"d":3,"h":44,"kind":"box","one":"The five steps of the Full lane: Define, Plan, Inspect, Build and Close.","what":"Define turns your idea into a spec you agree. Plan writes the plan and the tasks. Inspect checks they fit. Build runs each task test first. Close fixes drift between the docs and the code, and asks before a push.","how":"<code>skills/st-define</code>, <code>skills/st-plan</code>, <code>skills/st-inspect</code>, <code>skills/st-build</code>, <code>skills/st-close</code>. Each phase starts its agent, and the Full-lane view opens one phase view per phase (<code>full-define</code> to <code>full-close</code>). LikeC4 ids: <code>skills.st-define</code>, <code>skills.st-plan</code>, <code>skills.st-inspect</code>, <code>skills.st-build</code>, <code>skills.st-close</code>.","steps":[["Define","Grill, write the spec, clarify, checklist. Gate: you agree the spec."],["Plan","st-plan agent writes plan and tasks. Gate: you answer each open decision."],["Inspect","st-inspect agent checks spec, plan and tasks. Gate: OK to build."],["Build","Per task: failing test, build, verify, commit. Review each story."],["Close","Drift fixes, gaps, lessons, shortcuts. Gate: push."]]},{"id":"T","code":"T","name":"Tool skills","short":"TOOLS","group":"loop","gx":8,"gy":12,"w":2,"d":2,"h":30,"kind":"cards","one":"Slash commands any lane, or you, can call for one job.","what":"Some check work (review, test, debug, triage). Some set up or tune the project (init, update, status, theme). Some run parallel workers. Eleven come from outside projects: the grill, design helpers, a code graph and the ponytail family that keeps changes small.","how":"Checks: <code>skills/st-review</code>, <code>st-test</code>, <code>st-debug</code>, <code>st-triage</code>. Workers: <code>skills/st-worker</code> with <code>scripts/st-worker.sh</code> and <code>scripts/st-worktree.sh</code>, and <code>skills/st-herdr-workspace</code> with its script. Setup: <code>st-init</code>, <code>st-update</code> with <code>scripts/st-update.sh</code>, <code>st-status</code>, <code>st-sync</code>, <code>st-template</code>, <code>st-constitution</code>, <code>st-model</code>, <code>st-shape</code>, <code>st-theme</code>. Vendored: <code>st-grill</code>, <code>st-ui-ux</code>, <code>st-impeccable</code>, <code>st-graphify</code>, <code>st-hallmark</code> and six <code>st-ponytail</code> skills. LikeC4 ids: <code>skills.st-review</code>, <code>skills.st-test</code>, <code>skills.st-debug</code>, <code>skills.st-triage</code>, <code>skills.st-worker</code>, <code>skills.st-herdr-workspace</code>, <code>skills.st-init</code>, <code>skills.st-update</code>, <code>skills.st-status</code>, <code>skills.st-sync</code>, <code>skills.st-template</code>, <code>skills.st-constitution</code>, <code>skills.st-model</code>, <code>skills.st-shape</code>, <code>skills.st-theme</code>, <code>skills.st-grill</code>, <code>skills.st-ui-ux</code>, <code>skills.st-impeccable</code>, <code>skills.st-graphify</code>, <code>skills.st-hallmark</code>, <code>skills.st-ponytail</code>, <code>skills.st-ponytail-review</code>, <code>skills.st-ponytail-audit</code>, <code>skills.st-ponytail-debt</code>, <code>skills.st-ponytail-gain</code>, <code>skills.st-ponytail-help</code>, <code>scripts.st-worker-sh</code>, <code>scripts.st-worktree-sh</code>, <code>scripts.st-herdr-workspace-sh</code>, <code>scripts.st-update-sh</code>, and the data <code>project.graphify-out</code>, <code>project.graphify-out-graph-report-md</code>, <code>project.design-system</code>, <code>project.product-md</code>, <code>project.hallmark</code>.","cond":[{"q":"<b>Q-T1</b> /st-model lists st-worker as an agent (<code>skills/st-model/SKILL.md:11</code>), but <code>agents/st-worker.md</code> does not exist and /st-status says it has no agents file (<code>skills/st-status/SKILL.md:36</code>). Should /st-model drop it?"},{"q":"<b>Q-T2</b> /st-hallmark calls its command /hallmark (<code>skills/st-hallmark/SKILL.md:3,57</code>), but the skill name is st-hallmark (<code>:2</code>). Should the text say /st-hallmark?"},{"q":"<b>Q-T3</b> /st-impeccable names <code>.claude/skills/st-impeccable/scripts</code> (<code>skills/st-impeccable/SKILL.md:19,82</code>), which is not this plugin's layout, and calls /impeccable, not /st-impeccable (<code>:84,86</code>). Should the paths and the command name change?"},{"q":"<b>Q-T4</b> /st-ponytail-help tells you to update and read the upstream ponytail plugin, not Stratum (<code>skills/st-ponytail-help/SKILL.md:64,70</code>). Should it point at Stratum?"}]},{"id":"F","code":"F","name":"Feature files","short":"FEATURE FILES","group":"mem","gx":16,"gy":8,"w":3,"d":3,"h":28,"kind":"store","one":"The folder of one feature: spec, plan, tasks and the other design files.","what":"Each feature gets its own folder. The spec says what to build, the plan says how, and the tasks list the work with a test for each. The next phase, and the next session, read these files instead of remembering.","how":"<code>specs/NNN-feature/</code>: <code>spec.md</code>, <code>plan.md</code>, <code>research.md</code>, <code>data-model.md</code>, <code>contracts/</code>, <code>quickstart.md</code>, <code>tasks.md</code>, <code>checklists/</code>, <code>changes/</code> (Fast-lane plans), <code>decisions.md</code> (grill answers), <code>advisor.md</code> (advisor records) and <code>gaps.md</code>. LikeC4 ids: <code>project.specs</code>, <code>feature.spec-md</code>, <code>feature.plan-md</code>, <code>feature.research-md</code>, <code>feature.data-model-md</code>, <code>feature.contracts</code>, <code>feature.quickstart-md</code>, <code>feature.tasks-md</code>, <code>feature.checklists</code>, <code>feature.changes</code>, <code>feature.decisions-md</code>, <code>feature.advisor-md</code>, <code>feature.gaps-md</code>.","cond":[{"q":"<b>Q-F1</b> The model declares <code>specs/NNN-feature/gaps.md</code> (<code>docs/harness/model/data.c4:168</code>), but no skill, agent, procedure, script, hook or template names it. The gap report comes back as findings instead (<code>procedures/converge.md:29</code>, <code>agents/st-close.md:47</code>). Should a harness file write gaps.md?"}]},{"id":"S","code":"S","name":"State files","short":"STATE FILES","group":"mem","gx":4,"gy":4,"w":2,"d":2,"h":28,"kind":"store","one":"The .stratum folder: where the work stands, the project rules and the local settings.","what":"One small file says which feature, phase, lane and risk level this checkout is on. Beside it sit the project rules, the model choice per agent, and the flags a parallel worker run needs.","how":"<code>.stratum/state.json</code> holds feature, phase, lane and risk. <code>scripts/st-state.sh</code> sets keys and replaces the file in one atomic step, and the phase hook writes it too. Also <code>constitution.md</code>, <code>APP-constitution.md</code>, <code>decisions.md</code>, <code>models.json</code>, <code>approve/</code>, <code>autonomous</code>, <code>commit-mode</code> and <code>worker-setup.sh</code>. LikeC4 ids: <code>scripts.st-state-sh</code>, <code>stratum.state-json</code>, <code>stratum.constitution-md</code>, <code>stratum.app-constitution-md</code>, <code>stratum.decisions-md</code>, <code>stratum.models-json</code>, <code>stratum.approve</code>, <code>stratum.autonomous</code>, <code>stratum.commit-mode</code>, <code>stratum.worker-setup-sh</code>.","cond":[{"q":"<b>Q-S1</b> The st-quick agent sets phase in state.json with no script (<code>agents/st-quick.md:48</code>, its tools include Edit, <code>:4</code>). Other writers use st-state.sh (<code>skills/st-close/SKILL.md:58</code>, <code>skills/st-fast/SKILL.md:41</code>). Should it use st-state.sh?"}]},{"id":"R","code":"R","name":"Procedures and templates","short":"PROCEDURES","group":"mem","gx":16,"gy":12,"w":2,"d":2,"h":30,"kind":"cards","one":"The step files and templates that skills and agents follow to write the feature files.","what":"A procedure is a recipe: how to write a spec, a plan, the tasks, a checklist or a gap report. Templates give each file its shape. A project can keep its own copy of a template, and that copy wins.","how":"<code>procedures/</code>: <code>specify.md</code>, <code>clarify.md</code>, <code>checklist.md</code>, <code>plan.md</code>, <code>tasks.md</code>, <code>analyze.md</code>, <code>converge.md</code>, <code>constitution.md</code>, <code>issues.md</code>. <code>templates/</code> with project overrides in <code>.stratum/templates</code>, found by <code>scripts/resolve-template.sh</code>. <code>scripts/check-prerequisites.sh</code> finds the feature folder. <code>scripts/common.sh</code> holds shared shell functions. LikeC4 ids: <code>procedures.specify-md</code>, <code>procedures.clarify-md</code>, <code>procedures.checklist-md</code>, <code>procedures.plan-md</code>, <code>procedures.tasks-md</code>, <code>procedures.analyze-md</code>, <code>procedures.converge-md</code>, <code>procedures.constitution-md</code>, <code>procedures.issues-md</code>, <code>scripts.resolve-template-sh</code>, <code>scripts.check-prerequisites-sh</code>, <code>scripts.common-sh</code>, and the data <code>plugin.templates</code>, <code>plugin.templates-spec-md</code>, <code>plugin.templates-plan-md</code>, <code>plugin.templates-tasks-md</code>, <code>plugin.templates-checklist-md</code>, <code>plugin.templates-constitution-md</code>, <code>plugin.templates-models-json</code>, <code>stratum.templates</code>.","cond":[{"q":"<b>Q-R1</b> The tasks steps say tests are optional (<code>procedures/tasks.md:67</code>), but every task ends with <code>Test:</code> (<code>procedures/tasks.md:92</code>) and the st-build agent needs a red test before each build (<code>agents/st-build.md:40</code>). Which rule wins?"},{"q":"<b>Q-R2</b> The specify steps use \"the checklist template structure\" with no path and no resolve-template.sh call (<code>procedures/specify.md:80</code>). Only the spec template is resolved (<code>procedures/specify.md:38</code>), though <code>templates/checklist.md</code> exists. Should it resolve the checklist template too?"}]},{"id":"A","code":"A","name":"Plan and check agents","short":"PLAN AGENTS","group":"agents","gx":12,"gy":4,"w":2,"d":2,"h":40,"kind":"box","one":"Agents that write the plan, check it, or check an issue, and report back.","what":"The plan agent writes the plan and the tasks, and stops with the decisions it cannot settle. The inspect agent checks that spec, plan and tasks agree. The triage agent checks a GitHub issue against the code.","how":"<code>agents/st-plan.md</code> follows <code>procedures/plan.md</code> and <code>procedures/tasks.md</code>. <code>agents/st-inspect.md</code> follows <code>procedures/analyze.md</code> and writes only the Validate section of <code>plan.md</code>. <code>agents/st-triage.md</code> reads the issue with <code>gh issue view</code>. LikeC4 ids: <code>agents.st-plan</code>, <code>agents.st-inspect</code>, <code>agents.st-triage</code>."},{"id":"B","code":"B","name":"Build agents","short":"BUILD AGENTS","group":"agents","gx":12,"gy":8,"w":2,"d":2,"h":40,"kind":"box","one":"Agents that write the failing test, make it pass, fix it, review it, or build a screen.","what":"One agent writes a test that fails first. Another writes the code until it passes and never commits. A third finds the root cause when a test stays red after two tries. A reviewer reads the diff. The design agent builds a screen from the design file.","how":"<code>agents/st-test.md</code>, <code>agents/st-build.md</code>, <code>agents/st-debug.md</code>, <code>agents/st-review.md</code>, <code>agents/st-design.md</code>. LikeC4 ids: <code>agents.st-test</code>, <code>agents.st-build</code>, <code>agents.st-debug</code>, <code>agents.st-review</code>, <code>agents.st-design</code>.","steps":[["Test","st-test writes the task test and shows it fails."],["Build","st-build writes code until the test passes and ticks the task."],["Debug","st-debug finds the root cause after 2 red tries."],["Review","st-review reads the story diff and lists findings."]],"cond":[{"q":"<b>Q-B1</b> The st-build agent gives the Fast-lane path as <code>changes/NNN-name.md</code> with no feature folder (<code>agents/st-build.md:20</code>), but /st-fast and the st-fast agent put it under <code>specs/&lt;feature&gt;/changes/</code> (<code>skills/st-fast/SKILL.md:14</code>, <code>agents/st-fast.md:40</code>). Which path is right?"}]},{"id":"C","code":"C","name":"Lane and close agents","short":"LANE AGENTS","group":"agents","gx":12,"gy":12,"w":2,"d":2,"h":40,"kind":"box","one":"Agents that write a Fast-lane plan, make a Quick edit, close a feature, or audit in the background.","what":"The fast agent writes one short change plan. The quick agent makes one small edit. The close agent makes the docs match the code, gives the gap report when asked, and proposes lessons. Three more run audits in the background and change no file.","how":"<code>agents/st-fast.md</code>, <code>agents/st-quick.md</code>, <code>agents/st-close.md</code> (which runs <code>scripts/st-shortcuts.sh</code> for the shortcut list), <code>agents/st-impeccable.md</code>, <code>agents/st-ponytail-audit.md</code>, <code>agents/st-ponytail-debt.md</code>. LikeC4 ids: <code>agents.st-fast</code>, <code>agents.st-quick</code>, <code>agents.st-close</code>, <code>agents.st-impeccable</code>, <code>agents.st-ponytail-audit</code>, <code>agents.st-ponytail-debt</code>, <code>scripts.st-shortcuts-sh</code>.","cond":[{"q":"<b>Q-C1</b> /st-close says it records defer and drop in spec.md (<code>skills/st-close/SKILL.md:32</code>), but the st-close agent only returns the list and has no record step (<code>agents/st-close.md:47-48</code>). Who writes the record?"}]},{"id":"G","code":"G","name":"Gates","short":"GATES","group":"loop","gx":4,"gy":12,"w":2,"d":2,"h":44,"kind":"gate","one":"The steps where a lane stops and waits for your words.","what":"A gate names what you must say before the work moves on, like \"you agree the spec\" or \"push\". The Full lane has four, Fast has one, Quick has none, and the Design lane has one in its new look and custom modes.","how":"Not one file: a gate is a lane-view step whose label has <code>gate:</code> after the step number (D8). View <code>full</code>: (6) you agree the spec, (8) you answer each open decision, (10) OK to build, (13) push. View <code>fast</code>: (9) OK on the change plan. View <code>design</code>: (6) commit the reference screen, (10) commit the screen and the saved design. Each gate step is between <code>user</code> and the lane skill: <code>skills/st-define</code>, <code>st-plan</code>, <code>st-inspect</code>, <code>st-close</code> and <code>st-fast</code> pass the gate to you, and in the Design lane you pass your answer to <code>skills/st-design</code>. LikeC4 views: <code>full</code>, <code>full-define</code>, <code>full-plan</code>, <code>full-inspect</code>, <code>full-close</code>, <code>fast</code>, <code>design</code>, <code>design-new-look</code>, <code>design-custom</code>.","steps":[["Agree the spec","Full lane, end of Define."],["Answer each open decision","Full lane, Plan."],["OK to build","Full lane, end of Inspect."],["OK on the change plan","Fast lane, after the advisor verdict."],["Commit the screen","Design lane, new look and custom modes."],["Push","Full lane, end of Close."]],"cond":[{"q":"<b>Q-G1</b> /st-full names a Plan gate where you answer the open decisions (<code>skills/st-full/SKILL.md:11</code>), but the Gate section of /st-plan names no user gate, only the next phase (<code>skills/st-plan/SKILL.md:36-38</code>). Is Plan a gate or not?"}]},{"id":"V","code":"V","name":"Verify and lock","short":"VERIFY","group":"check","gx":16,"gy":4,"w":2,"d":2,"h":34,"kind":"job","one":"Re-runs a test after an agent says it passed, and keeps shared runs to one at a time.","what":"An agent can say \"green\" and be wrong. The verify script runs the test again and also fails when new code has explanation comments. The lock makes a second test run wait while the first one uses the shared test or Codex tab.","how":"<code>scripts/st-verify.sh</code> prints one PASS or FAIL line. <code>scripts/st-lock.sh</code> makes a lock folder <code>.git/stratum-NAME.lock</code> in the git common folder. LikeC4 ids: <code>scripts.st-verify-sh</code>, <code>scripts.st-lock-sh</code>, and the data <code>project.git-stratum-name-lock</code>."},{"id":"X","code":"X","name":"Advisor script","short":"ADVISOR POINT","group":"check","gx":12,"gy":0,"w":2,"d":2,"h":40,"kind":"box","one":"Runs one advisor point: picks the reviewers, sends the review and records the verdict.","what":"At set points (the plan, a Fast-lane change, a test still red after two tries, the small decisions, the final diff) the work goes out for review. The advisor mode decides who reviews: auto, Codex, both or off.","how":"<code>scripts/st-advisor.sh</code> reads the mode in <code>.stratum/advisor.json</code> and the risk level, sends the prompt to Codex headless with <code>codex exec</code> read-only, or through <code>scripts/st-codex-agent.sh</code> in a herdr Codex tab under the lock, and appends each verdict to <code>specs/NNN-feature/advisor.md</code>. LikeC4 ids: <code>scripts.st-advisor-sh</code>, <code>scripts.st-codex-agent-sh</code>, <code>stratum.advisor-json</code>.","steps":[["Pick","Advisors from the mode and the risk level."],["Send","Review prompt and answer schema to Codex, read-only."],["Read","Answer JSON: verdict, summary and findings."],["Record","Point, time, input hash and verdict in advisor.md."]]},{"id":"K","code":"K","name":"Codex","short":"CODEX","group":"check","gx":16,"gy":0,"w":2,"d":2,"h":40,"kind":"box","one":"A second model from OpenAI that reviews the work and never changes it.","what":"Codex reads what it is sent and answers with a verdict and findings. It runs in a read-only sandbox, so it cannot build or fix anything.","how":"The <code>codex</code> CLI, run with its own home <code>~/.local/state/stratum/codex-home</code> that links your Codex login and marks each project untrusted. LikeC4 ids: <code>codex</code>, <code>outside.local-state-stratum-codex-home</code>, <code>outside.codex-auth-json</code>."},{"id":"D","code":"D","name":"/advisor","short":"/ADVISOR","group":"check","gx":8,"gy":0,"w":2,"d":2,"h":40,"kind":"box","one":"The reviewer model you set in Claude Code, asked at the same points as Codex.","what":"If you set a reviewer with /advisor, the Build phase and the Fast lane give it the same input they give Codex: a red test, the diff, the list of small decisions.","how":"Set by you with <code>/advisor</code> in Claude Code, not a plugin file. <code>skills/st-build</code> and <code>skills/st-fast</code> pass it the same input as Codex at each advisor point. LikeC4 id: <code>advisor</code>."},{"id":"E","code":"E","name":"Hook events","short":"HOOK EVENTS","group":"guard","gx":4,"gy":16,"w":3,"d":2,"h":16,"kind":"slab","one":"The moments Claude Code announces, and the list of which hook runs at each.","what":"Claude Code calls out moments like \"a tool is about to run\", \"a session starts\" or \"you sent a prompt\". Stratum lists which hook file runs at each one. Claude Code also runs the status line command named in its settings, with no hook event.","how":"<code>hooks/commands.json</code> binds each event and tool matcher to its hook commands. <code>hooks/hooks.json</code> lists the hook module <code>token-weather.mjs</code>. Events: PreToolUse, PermissionRequest, SessionStart, SubagentStart, UserPromptSubmit, SessionEnd, PreCompact. LikeC4 ids: <code>claude</code>, <code>events.pre-tool-use</code>, <code>events.permission-request</code>, <code>events.session-start</code>, <code>events.subagent-start</code>, <code>events.user-prompt-submit</code>, <code>events.session-end</code>, <code>events.pre-compact</code>, <code>hooks.commands-json</code>, <code>hooks.hooks-json</code>.","steps":[["SessionStart","Handoff, communication rules and ponytail rules."],["UserPromptSubmit","Ponytail mode and the reply label for the phase."],["PreToolUse","Git guard on Bash, model on Agent, phase on Skill, approve lock on file tools."],["PermissionRequest","The approve hook answers for a worker."],["SubagentStart","Ponytail rules for the subagent."],["SessionEnd and PreCompact","Save the handoff facts."]]},{"id":"W","code":"W","name":"Git guard","short":"GIT GUARD","group":"guard","gx":8,"gy":16,"w":2,"d":2,"h":44,"kind":"gate","one":"Reads each shell command and asks or denies commits, pushes and destructive git.","what":"Before any shell command runs, the guard looks for git words. Depending on the project setting it asks you, or refuses, so a commit or a push never happens by surprise.","how":"<code>hooks/st-git-guard.py</code> runs on PreToolUse with matcher Bash and reads the commit mode, destructive git modes and guarded branch from <code>.stratum/git-guard.json</code>. LikeC4 ids: <code>hooks.st-git-guard-py</code>, <code>stratum.git-guard-json</code>."},{"id":"H","code":"H","name":"Approve, phase and model hooks","short":"RULE HOOKS","group":"guard","gx":12,"gy":16,"w":2,"d":2,"h":44,"kind":"gate","one":"Hooks that track the phase, set each agent's model, and answer permissions for workers.","what":"When a phase skill starts, one hook writes the phase down and warns if it is out of order. Another sets the model and effort of each agent from the project settings. A third stops workers from touching files they do not own and, in an autonomous run, lets the orchestrator answer their permission requests.","how":"<code>hooks/st-phase.py</code> (PreToolUse matcher Skill, and every prompt) writes <code>.stratum/state.json</code>. <code>hooks/st-models.py</code> (matcher Agent) reads <code>.stratum/models.json</code>. <code>hooks/st-approve.py</code> (file tools and every PermissionRequest) reads <code>.stratum/approve</code> and <code>.stratum/autonomous</code>. LikeC4 ids: <code>hooks.st-phase-py</code>, <code>hooks.st-models-py</code>, <code>hooks.st-approve-py</code>."},{"id":"M","code":"M","name":"Handoff","short":"HANDOFF","group":"mem","gx":0,"gy":4,"w":2,"d":2,"h":28,"kind":"store","one":"The note that lets the next session start where this one stopped.","what":"At the end of a session, and before Claude Code shrinks its memory, a hook saves the facts: phase, lane, tasks done, branch and recent commits. /st-handoff adds the goal, the decisions and the next step. The next session prints it back at start.","how":"<code>skills/st-handoff</code> and <code>hooks/st-handoff-facts.sh</code> (SessionEnd, PreCompact) write <code>.stratum/handoff.md</code>. <code>hooks/st-session-start.sh</code> prints it with the rules of <code>sr-opus-5.md</code>, and in a worktree links the shared .stratum files. Close lessons wait in <code>.stratum/lessons.md</code>. LikeC4 ids: <code>skills.st-handoff</code>, <code>hooks.st-handoff-facts-sh</code>, <code>hooks.st-session-start-sh</code>, <code>stratum.handoff-md</code>, <code>stratum.lessons-md</code>, <code>plugin.sr-opus-5-md</code>.","steps":[["Save facts","SessionEnd or PreCompact: phase, lane, tasks, branch, commits."],["Write","/st-handoff: goal, where we are, decisions, next step."],["Print back","SessionStart: rules and the last handoff."]]},{"id":"N","code":"N","name":"Statusline and ponytail","short":"STATUSLINE","group":"guard","gx":0,"gy":16,"w":2,"d":2,"h":36,"kind":"screen","one":"The status bar under the prompt, and the ponytail rules that keep changes small.","what":"The status line shows the model, git, commit mode, ponytail level, the autonomous flag and the Token Weather line about how full the context is. Ponytail hooks give every session and subagent the \"smallest change that works\" rules and track the level you set.","how":"<code>statusline/st-statusline.sh</code> merges <code>statusline/powerline.json</code>, <code>statusline/themes.json</code> and <code>.stratum/powerline.json</code>. <code>hooks/token-weather.mjs</code> writes <code>.stratum/weather.json</code>. <code>hooks/ponytail/</code> holds eight files that set, track and pass on the live mode. LikeC4 ids: <code>statusline.st-statusline-sh</code>, <code>statusline.powerline-json</code>, <code>statusline.themes-json</code>, <code>hooks.token-weather-mjs</code>, <code>hooks.ponytail-activate-js</code>, <code>hooks.ponytail-config-js</code>, <code>hooks.ponytail-instructions-js</code>, <code>hooks.ponytail-map-js</code>, <code>hooks.ponytail-mode-tracker-js</code>, <code>hooks.ponytail-runtime-js</code>, <code>hooks.ponytail-statusline-sh</code>, <code>hooks.ponytail-subagent }
function drawNode(n){
  const g=el('g',{class:'node',style:'cursor:pointer','data-id':n.id});
  const {gx,gy,w,d,h}=n; const sel=S.selected===n.id, hov=S.hover===n.id, fresh=!n.inside&&isNew(n.id);
  const sw=sel?2:1.2, dash=n.ghost?'4 3':null, face=n.ghost?'none':'var(--face)';
  const face3=(p,fill,hatch,extra={})=>{const poly=el('polygon',{points:pts(p),fill:fill,stroke:'var(--ink)','stroke-width':sw,'stroke-linejoin':'round',...extra});if(dash)poly.setAttribute('stroke-dasharray',dash);g.appendChild(poly);if(hatch&&!n.ghost){g.appendChild(el('polygon',{points:pts(p),fill:'url(#'+hatch+')',style:'color:var(--ink)',stroke:'none'}));}};
  const box=(z0,z1,hatchTop)=>{ face3([P(gx,gy+d,z0),P(gx+w,gy+d,z0),P(gx+w,gy+d,z1),P(gx,gy+d,z1)],face,'hatch'); face3([P(gx+w,gy,z0),P(gx+w,gy+d,z0),P(gx+w,gy+d,z1),P(gx+w,gy,z1)],face,'hatch'); face3([P(gx,gy,z1),P(gx+w,gy,z1),P(gx+w,gy+d,z1),P(gx,gy+d,z1)],face,hatchTop||null); };
  const kind=n.kind||'box';
  if(kind==='store'){ const L=3, gap=3, lh=(h-gap*(L-1))/L; for(let i=0;i<L;i++){ const z0=i*(lh+gap); box(z0,z0+lh,null);} }
  else if(kind==='cards'){ const L=5, lh=h/L; for(let i=0;i<L;i++) box(i*lh,(i+1)*lh,null); }
  else if(kind==='slab'){ box(0,h,'hatchLight'); }
  else if(kind==='screen'){ box(0,h,null); const inset=.3; if(!n.ghost){ const scr=[P(gx+inset,gy+inset,h),P(gx+w-inset,gy+inset,h),P(gx+w-inset,gy+d-inset,h),P(gx+inset,gy+d-inset,h)]; g.appendChild(el('polygon',{points:pts(scr),fill:'var(--paper)',stroke:'var(--ink)','stroke-width':.9})); for(let i=1;i<=3;i++){const a=P(gx+inset+.2,gy+inset+i*.4,h),b=P(gx+w-inset-.4-(i===3?.5:0),gy+inset+i*.4,h);g.appendChild(el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'var(--ink)','stroke-width':.8,opacity:.7}));} } }
  else if(kind==='gate'){ box(0,h,null); if(!n.ghost){ const z0=h*.55,z1=h*.75; const band=[[P(gx,gy+d,z0),P(gx+w,gy+d,z0),P(gx+w,gy+d,z1),P(gx,gy+d,z1)],[P(gx+w,gy,z0),P(gx+w,gy+d,z0),P(gx+w,gy+d,z1),P(gx+w,gy,z1)]]; band.forEach(p=>g.appendChild(el('polygon',{points:pts(p),fill:'var(--ink)',opacity:.85,stroke:'none'}))); } }
  else if(kind==='tall'){ box(0,h,null); if(!n.ghost){ // roof ridge line on top to read as "the brain"
      const c=P(gx+w/2,gy+d/2,h); const a=P(gx,gy+d,h),b=P(gx+w,gy,h); g.appendChild(el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'var(--ink)','stroke-width':.8,opacity:.5})); } }
  else if(kind==='job'){ box(0,h,'hatchLight'); }
  else { box(0,h,null); }
  const top=[P(gx,gy,h),P(gx+w,gy,h),P(gx+w,gy+d,h),P(gx,gy+d,h)];
  if(sel||hov){ g.appendChild(el('polygon',{points:pts(top),fill:sel?'var(--ink)':'none',opacity:sel?.12:1,stroke:'var(--ink)','stroke-width':sel?2.5:1.8})); }
  if(fresh&&!sel){ g.appendChild(el('polygon',{class:'halo',points:pts([P(gx-.35,gy-.35,0),P(gx+w+.35,gy-.35,0),P(gx+w+.35,gy+d+.35,0),P(gx-.35,gy+d+.35,0)]),fill:'none',stroke:'var(--ink)','stroke-width':1.4,'stroke-dasharray':'4 3'})); }
  const c=P(gx+w/2,gy+d/2,h); const chipW=16;
  g.appendChild(el('rect',{x:c[0]-chipW/2,y:c[1]-8,width:chipW,height:14,fill:sel?'var(--hi-bg)':'var(--paper)',stroke:'var(--ink)','stroke-width':1}));
  const t=el('text',{x:c[0],y:c[1]+3,'text-anchor':'middle','font-size':'9','font-family':'var(--mono)',fill:sel?'var(--hi-fg)':'var(--ink)','font-weight':'600'}); t.textContent=n.code; g.appendChild(t);
  g.addEventListener('mouseenter',e=>{S.hover=n.id;showTip(e,n);renderPanel();render();});
  g.addEventListener('mousemove',e=>moveTip(e));
  g.addEventListener('mouseleave',()=>{S.hover=null;hideTip();renderPanel();render();});
  g.addEventListener('click',e=>{e.stopPropagation();select(n.id);});
  g.addEventListener('dblclick',e=>{e.stopPropagation();if(!n.inside)goInside(n.id);});
  return g;
}

/* ---------------- PACKETS ---------------- */
function initPackets(){ S.packets=[]; const flows=[...new Set(sceneHops.map(h=>h.flow))]; flows.forEach(f=>S.packets.push({flow:f,hop:0,t:0,speed:.5,pause:0})); S.selPacket=null; }
function hopsOf(flow){ return sceneHops.filter(h=>h.flow===flow); }
function drawPackets(){
  const pg=world.querySelector('#pkts'); if(!pg)return; pg.innerHTML='';
  S.packets.forEach((p,i)=>{ const hs=hopsOf(p.flow); const h=hs[p.hop]; if(!h||!h.path)return; const [x,y]=pointAt(h.path,p.t);
    const isSel=S.selPacket===i; const g=el('g',{class:'pkt',style:'cursor:pointer'});
    if(isSel) g.appendChild(el('circle',{cx:x,cy:y,r:11,fill:'none',stroke:'var(--ink)','stroke-width':1.2,'stroke-dasharray':'2 2'}));
    g.appendChild(el('circle',{cx:x,cy:y,r:5.5,fill:'var(--ink)',stroke:'var(--paper)','stroke-width':1.6}));
    if(isSel||S.hoverPacket===i||S.ch<CH.length-1){ const lbl=el('text',{x:x+10,y:y-8,'font-size':'10','font-family':'var(--mono)',fill:'var(--ink)','font-weight':'500'}); lbl.textContent=h.label; g.appendChild(el('rect',{x:x+7,y:y-19,width:h.label.length*6.4+6,height:14,fill:'var(--paper)',stroke:'var(--ink)','stroke-width':.8})); g.appendChild(lbl); }
    g.addEventListener('click',e=>{e.stopPropagation();S.selPacket=i;S.playing=false;syncFlowBtn();renderPanel();drawPackets();});
    g.addEventListener('mouseenter',()=>{S.hoverPacket=i;drawPackets();});
    g.addEventListener('mouseleave',()=>{S.hoverPacket=null;drawPackets();});
    pg.appendChild(g);
  });
}
let last=0;
function tick(ts){ const dt=Math.min(.05,(ts-last)/1000||0); last=ts; tweenTick(); if(S.playing){ S.packets.forEach(p=>advance(p,dt)); drawPackets(); if(S.selPacket!=null) renderPanel(); } requestAnimationFrame(tick); }
function advance(p,dt){ const hs=hopsOf(p.flow); if(!hs.length)return; if(p.pause>0){p.pause-=dt;return;} const h=hs[p.hop]; if(!h||!h.path){p.hop=(p.hop+1)%hs.length;return;} p.t+=dt*p.speed*(320/Math.max(120,h.path.len)); if(p.t>=1){p.t=0;p.hop=(p.hop+1)%hs.length;p.pause=(p.hop===0?1.2:.35);} }
function stepOnce(){ S.playing=false; syncFlowBtn(); let i=S.selPacket??0; const p=S.packets[i]; if(!p)return; const hs=hopsOf(p.flow); p.hop=(p.hop+1)%hs.length; p.t=.5; p.pause=0; S.selPacket=i; drawPackets(); renderPanel(); }
function syncFlowBtn(){ document.getElementById('btnFlow').textContent = S.playing?'‖ Pause':'▸ Play'; }
requestAnimationFrame(tick);

/* ---------------- PANEL ---------------- */
function nodeChip(id){ const n=byId[id]; return `<button class="chip${n.ghost?' ghost':''}" onclick="select('${id}')">${esc(n.code)} · ${esc(n.name)}</button>`; }
function renderPanel(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  if(S.selPacket!=null && S.packets[S.selPacket]){ const p=S.packets[S.selPacket]; const hs=hopsOf(p.flow); const h=hs[p.hop];
    const A=sceneNodes.find(n=>n.id===h.from), B=sceneNodes.find(n=>n.id===h.to); const flowName=p.flow==='ch'?CH[S.ch].title:p.flow==='inside'?'inside '+byId[S.inside].name:(FLOWS.find(f=>f.id===p.flow)||{}).name;
    body.innerHTML=`<div class="eyebrow">Data packet · ${esc(flowName)} · hop ${p.hop+1} of ${hs.length}</div><h1 class="t">${esc(h.label)}</h1>
    <div class="pk"><div class="lbl">Route</div><div class="route">${esc(A.code)} ${esc(A.name)} &nbsp;→&nbsp; ${esc(B.code)} ${esc(B.name)}</div><div class="lbl">Payload (representative)</div><pre>${esc(JSON.stringify(h.payload,null,2))}</pre></div>
    <p>Payload shapes are what the design implies, not measured traffic.</p>
    <div class="actions"><button class="ctl" onclick="stepOnce()">Trace one step</button><button class="ctl" onclick="S.selPacket=null;S.playing=true;syncFlowBtn();renderPanel();drawPackets()">Release & play</button><button class="ctl" onclick="select('${esc(B.id)}')">Open ${esc(B.code)}</button></div>`; return; }
  const id=S.selected??S.hover; const n=id?sceneNodes.find(x=>x.id===id):null;
  if(!n){ renderChapterPanel(); return; }
  if(n.inside){ const parent=byId[S.inside]; const i=+n.id.slice(1);
    body.innerHTML=`<div class="eyebrow">Inside ${esc(parent.code)} · ${esc(parent.name)} · step ${i+1} of ${parent.steps.length}</div><h1 class="t">${esc(n.name)}</h1><p class="lede">${esc(n.desc)}</p>
    <h3 class="sec">All steps</h3>${parent.steps.map((s,j)=>`<div class="step ${j===i?'cur':''}"><div class="no">${j+1}</div><div class="tx"><b>${esc(s[0])}</b> — ${esc(s[1])}</div></div>`).join('')}
    <div class="actions"><button class="ctl" onclick="comeOut()">← Come back out</button></div>`; return; }
  const status = n.ghost?'<span class="chip ghost static">Not switched on</span>':`<span class="chip static">${n.group==='loop'?'turn loop':n.group==='mem'?'memory':'supporting'}</span>`;
  const pinned=S.selected===n.id;
  let content='';
  if(S.tab==='what') content=`<p class="lede">${n.one}</p><details${pinned?' open':''}><summary>Read more</summary><p>${n.what}</p></details>${n.steps?`<details><summary>Steps in execution</summary>${n.steps.map((s,j)=>`<div class="step"><div class="no">${j+1}</div><div class="tx"><b>${esc(s[0])}</b> — ${esc(s[1])}</div></div>`).join('')}</details>`:''}`;
  else if(S.tab==='how') content=`<p class="lede">${n.one}</p><p>${n.how}</p>`;
  else content=`<p class="lede">${n.one}</p>`+(n.cond&&n.cond.length?qHtml(n.cond):`<p>Nothing open here right now.</p>`);
  body.innerHTML=`<div class="eyebrow">${esc(n.code)} · ${pinned?'pinned':'hovering'}${isNew(n.id)?' · new in this chapter':''}</div><h1 class="t">${esc(n.name)}</h1><div class="sub">${status}</div>${content}
  ${pinned?`<div class="actions">${n.steps?`<button class="ctl" onclick="goInside('${n.id}')">→ Go inside</button>`:''}<button class="ctl" onclick="select(null)">Back to chapter</button></div>`:''}`;
}
function renderChapterPanel(){
  const c=CH[S.ch]; const last=S.ch===CH.length-1;
  if(S.tab==='how'){ body.innerHTML=HOW_HTML; return; }
  if(S.tab==='cond'){ body.innerHTML=`<div class="eyebrow">${esc(TITLE)}</div><h1 class="t">Open questions</h1><div class="sub">${last?'everything unresolved, by structure':'for the structures revealed so far'}</div>`+NODES.filter(n=>revealedIds().includes(n.id)&&n.cond&&n.cond.length).map(n=>`<h3 class="sec">${n.code} · ${esc(n.name)}${n.ghost?' <span class="chip ghost static">later</span>':''}</h3>${qHtml(n.cond)}`).join(''); return; }
  const chips = last ? '' : `<h3 class="sec">New in this chapter</h3><div>${c.reveal.map(nodeChip).join('')}</div>`;
  const nav=`<div class="actions"><button class="ctl" onclick="prevCh()" ${S.ch===0?'disabled':''}>◂ Back</button><button class="ctl primary" onclick="nextCh()" ${last?'disabled':''}>${S.ch===CH.length-2?'Show the whole system ▸':'Next ▸'}</button></div>`;
  body.innerHTML=`<div class="eyebrow">Chapter ${S.ch+1} of ${CH.length}</div><h1 class="t">${esc(c.title)}</h1><p class="lede">${c.lede}</p>${c.story}${chips}${nav}
  ${last?`<h3 class="sec">Decisions locked</h3><ul>${DECISIONS_HTML}</ul>`:''}`;
}
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{S.tab=b.dataset.tab;S.selPacket=null;renderPanel();drawPackets();}));

/* ---------------- STATS ---------------- */
function renderStats(){ const el=document.getElementById('stats'); const open=NODES.reduce((a,n)=>a+qOpen(n),0), routed=NODES.reduce((a,n)=>a+(n.cond||[]).filter(c=>c.to).length,0), res=NODES.reduce((a,n)=>a+(n.cond||[]).filter(c=>c.r).length,0);
  const dyn={chapter:`${S.ch+1} / ${CH.length}`, shown:`${revealedIds().length} / ${NODES.length}`, questions:`${open} open · ${routed} routed · ${res} resolved`};
  const all=[...(STATS||[]), {k:'Chapter',v:dyn.chapter},{k:'Structures shown',v:dyn.shown},{k:'Open questions',v:dyn.questions,grow:true}];
  el.innerHTML=all.map(s=>`<div class="stat${s.grow?' grow':''}"><div class="k">${s.k}</div><div class="v">${s.v}</div></div>`).join(''); }

/* ---------------- INDEX + RAIL ---------------- */
function renderIndex(){
  const ix=document.getElementById('index'); ix.innerHTML=''; const rev=new Set(revealedIds());
  GROUPS.forEach(g=>{ const h=document.createElement('h4'); h.textContent=g.title; ix.appendChild(h);
    NODES.filter(n=>n.group===g.id).forEach(n=>{ const b=document.createElement('button'); const shown=rev.has(n.id);
      b.className='ix'+(n.ghost&&shown?' ghost':'')+(!shown?' later':'')+(S.selected===n.id?' on':'')+(isNew(n.id)?' new':''); b.dataset.id=n.id;
      b.innerHTML=`<span class="code">${n.code}</span><span class="nm">${esc(n.name)}</span><span class="n" title="${shown?'open questions':'revealed in chapter'}">${shown?qOpen(n):'ch '+(revealChapterOf(n.id)+1)}</span>`;
      b.addEventListener('click',()=>{ if(!shown){ gotoCh(revealChapterOf(n.id)); select(n.id); return; } if(S.view!=='world')comeOut(); select(n.id); focusNode(n); });
      b.addEventListener('mouseenter',()=>{ if(S.view==='world'&&shown){S.hover=n.id;renderPanel();render();} });
      b.addEventListener('mouseleave',()=>{ if(S.view==='world'){S.hover=null;renderPanel();render();} });
      ix.appendChild(b); }); });
  renderStats();
}
function renderRail(){ const r=document.getElementById('rail'); if(S.view!=='world'){ r.innerHTML=`<span class="title">THE SYSTEM &nbsp;›&nbsp; <b>${esc(byId[S.inside].code)} ${esc(byId[S.inside].name)}</b> &nbsp;·&nbsp; steps in execution</span>`; document.getElementById('flowSel').style.display='none'; return; }
  r.innerHTML=CH.map((c,i)=>`<button class="ch ${i===S.ch?'on':i<S.ch?'done':''} ${i>S.maxCh+1?'locked':''}" title="${esc(c.title)}" onclick="gotoCh(${i})">${i+1}</button>`).join('')+`<span class="title">chapter ${S.ch+1} · <b>${esc(CH[S.ch].title)}</b></span>`;
  const fs=document.getElementById('flowSel'); fs.style.display = S.ch===CH.length-1?'flex':'none';
  if(!fs.dataset.built){ fs.innerHTML=[...FLOWS.map(f=>`<button data-f="${f.id}">${f.name}</button>`),'<button data-f="both">All flows</button>'].join(''); fs.dataset.built='1'; fs.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{S.flowSel=b.dataset.f;buildWorldScene();initPackets();render();})); }
  fs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.f===S.flowSel));
  document.getElementById('btnBack').disabled=S.ch===0; document.getElementById('btnNext').disabled=S.ch===CH.length-1;
}

/* ---------------- NAV ---------------- */
function select(id){ S.selected=id; S.selPacket=null; renderIndex(); renderPanel(); render(); }
function gotoCh(i){ i=Math.max(0,Math.min(CH.length-1,i)); if(S.view!=='world'){S.view='world';S.inside=null;} S.ch=i; S.maxCh=Math.max(S.maxCh,i); S.selected=null; S.hover=null; S.tab='what'; buildWorldScene(); initPackets(); S.playing=true; syncFlowBtn(); renderIndex(); render(); renderPanel(); fitView(true); }
function nextCh(){ gotoCh(S.ch+1); } function prevCh(){ gotoCh(S.ch-1); }
function goInside(id){ const n=byId[id]; if(!n||!n.steps)return; S.view='inside'; S.inside=id; S.selected='s0'; buildInsideScene(n); initPackets(); fitView(true); renderIndex(); render(); renderPanel(); }
function comeOut(){ const was=S.inside; S.view='world'; S.inside=null; buildWorldScene(); initPackets(); S.selected=was; fitView(true); renderIndex(); render(); renderPanel(); }
function orderList(){ return S.view==='world'?sceneNodes.map(n=>n.id):sceneNodes.map(n=>n.id); }
document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT')return; const L=orderList(); let i=L.indexOf(S.selected);
  if(e.key==='ArrowDown'){e.preventDefault();select(L[Math.min(L.length-1,i+1)]);}
  else if(e.key==='ArrowUp'){e.preventDefault();select(L[Math.max(0,i-1)]);}
  else if(e.key==='ArrowRight'){e.preventDefault(); if(S.view==='world'&&S.selected)goInside(S.selected);}
  else if(e.key==='ArrowLeft'){e.preventDefault(); if(S.view==='inside')comeOut(); else select(null);}
  else if(e.key==='Enter'||e.key===']'){e.preventDefault(); if(S.view==='world')nextCh();}
  else if(e.key==='['){e.preventDefault(); if(S.view==='world')prevCh();}
  else if(e.key===' '){e.preventDefault();toggleFlow();}
  else if(e.key==='Escape'){select(null);} });

/* ---------------- VIEW / PAN / ZOOM ---------------- */
let tween=null;
function applyView(){ world.setAttribute('transform',`translate(${S.tx},${S.ty}) scale(${S.k})`); }
function tweenTick(){ if(!tween)return; const now=performance.now(); let u=Math.min(1,(now-tween.t0)/tween.dur); u=1-Math.pow(1-u,3); S.tx=tween.a.tx+(tween.b.tx-tween.a.tx)*u; S.ty=tween.a.ty+(tween.b.ty-tween.a.ty)*u; S.k=tween.a.k+(tween.b.k-tween.a.k)*u; applyView(); if(u>=1)tween=null; }
function setView(tx,ty,k,anim){ tween=null; if(anim&&!matchMedia('(prefers-reduced-motion: reduce)').matches){ tween={a:{tx:S.tx,ty:S.ty,k:S.k},b:{tx,ty,k},t0:performance.now(),dur:520}; } else { S.tx=tx;S.ty=ty;S.k=k;applyView(); } }
function bbox(){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; sceneNodes.forEach(n=>{[P(n.gx,n.gy,n.h),P(n.gx+n.w,n.gy,n.h),P(n.gx+n.w,n.gy+n.d,-24),P(n.gx,n.gy+n.d,0),P(n.gx,n.gy,0)].forEach(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);});}); return {x0,y0,x1,y1}; }
function fitView(anim){ const r=svg.getBoundingClientRect(); if(!sceneNodes.length)return; const b=bbox(); const pad=40; const k=Math.min((r.width-pad*2)/Math.max(1,b.x1-b.x0),(r.height-pad*2)/Math.max(1,b.y1-b.y0)); if(r.width<80||r.height<80||!isFinite(k)||k<=0)return; const kk=Math.max(.2,Math.min(k,1.5)); setView(r.width/2-((b.x0+b.x1)/2)*kk, r.height/2-((b.y0+b.y1)/2)*kk+8, kk, anim); }
function focusNode(n){ const r=svg.getBoundingClientRect(); const c=P(n.gx+n.w/2,n.gy+n.d/2,n.h/2); setView(r.width/2-c[0]*S.k, r.height/2-c[1]*S.k, S.k, true); }
function zoomAt(f,cx,cy){ tween=null; const nk=Math.max(.35,Math.min(3,S.k*f)); S.tx=cx-(cx-S.tx)*(nk/S.k); S.ty=cy-(cy-S.ty)*(nk/S.k); S.k=nk; applyView(); }
svg.addEventListener('wheel',e=>{e.preventDefault(); const r=svg.getBoundingClientRect(); zoomAt(e.deltaY<0?1.1:0.9,e.clientX-r.left,e.clientY-r.top);},{passive:false});
let drag=null; svg.addEventListener('pointerdown',e=>{ if(e.button!==0)return; tween=null; drag={x:e.clientX,y:e.clientY,tx:S.tx,ty:S.ty,moved:false}; svg.setPointerCapture(e.pointerId); });
svg.addEventListener('pointermove',e=>{ if(!drag)return; const dx=e.clientX-drag.x,dy=e.clientY-drag.y; if(Math.hypot(dx,dy)>3){drag.moved=true;svg.classList.add('dragging');} S.tx=drag.tx+dx; S.ty=drag.ty+dy; applyView(); });
svg.addEventListener('pointerup',e=>{ if(drag&&!drag.moved){ select(null); } drag=null; svg.classList.remove('dragging'); });
document.getElementById('zin').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1.2,r.width/2,r.height/2);};
document.getElementById('zout').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1/1.2,r.width/2,r.height/2);};
window.addEventListener('resize',()=>fitView(false));

/* ---------------- TIP ---------------- */
function showTip(e,n){ tip.style.display='block'; tip.textContent=n.inside?n.desc:(n.ghost?'Later · ':'')+n.name+' — '+(n.one||'').replace(/<[^>]+>/g,''); moveTip(e); }
function moveTip(e){ const r=svg.getBoundingClientRect(); let x=e.clientX-r.left+14,y=e.clientY-r.top+14; if(x+290>r.width)x-=300; if(y+60>r.height)y-=70; tip.style.left=x+'px'; tip.style.top=y+'px'; }
function hideTip(){ tip.style.display='none'; }

/* ---------------- CONTROLS ---------------- */
function toggleFlow(){ S.playing=!S.playing; if(S.playing)S.selPacket=null; syncFlowBtn(); renderPanel(); drawPackets(); }
document.getElementById('btnFlow').onclick=toggleFlow;
document.getElementById('btnStep').onclick=stepOnce;
document.getElementById('btnReset').onclick=()=>{ select(null); fitView(true); };
document.getElementById('btnNext').onclick=nextCh; document.getElementById('btnBack').onclick=prevCh;

/* ---------------- BOOT ---------------- */
gotoCh(0);
</script>
